<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-label="Finans piyasaları ve şehir silüeti">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset=".48" stop-color="#0b2742"/>
      <stop offset="1" stop-color="#061019"/>
    </linearGradient>
    <radialGradient id="glow" cx=".68" cy=".22" r=".68">
      <stop offset="0" stop-color="#2787ff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#124c8d" stop-opacity=".13"/>
      <stop offset="1" stop-color="#061019" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#183b58"/>
      <stop offset="1" stop-color="#08141f"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" x2="1">
      <stop offset="0" stop-color="#42e8b4"/>
      <stop offset=".55" stop-color="#58a1ff"/>
      <stop offset="1" stop-color="#b581ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#75a9d8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1400" height="1100" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1400" height="1100" fill="url(#bg)"/>
    <rect width="1400" height="1100" fill="url(#glow)"/>
    <rect width="1400" height="1100" fill="url(#grid)"/>

    <circle cx="1040" cy="205" r="155" fill="#2c8fff" opacity=".14" filter="url(#blur)"/>
    <circle cx="285" cy="860" r="160" fill="#38dfae" opacity=".08" filter="url(#blur)"/>

    <!-- city skyline -->
    <g opacity=".95" filter="url(#soft)">
      <path d="M0 860V690h90v-90h82v260zm145 0V540h92v320zm215 0V645h76V490h86v370zm225 0V560h55V430h70V295h75v565zm250 0V520h86v-95h92v435zm215 0V610h72V485h96v375zm205 0V680h145v180z" fill="url(#tower)" stroke="#2a5a80" stroke-width="2"/>
      <g fill="#76bfff" opacity=".55">
        <path d="M42 726h18v20H42zm0 49h18v20H42zm56-108h18v20H98zm73-72h18v20h-18zm0 54h18v20h-18zm45 0h18v20h-18z"/>
        <path d="M388 690h19v22h-19zm0-54h19v22h-19zm59-108h19v22h-19zm0 54h19v22h-19zm82-40h19v22h-19z"/>
        <path d="M620 590h18v22h-18zm0-58h18v22h-18zm70-76h18v22h-18zm0-58h18v22h-18zm74-50h18v22h-18z"/>
        <path d="M878 565h19v22h-19zm0-57h19v22h-19zm62-48h19v22h-19zm63 6h19v22h-19z"/>
        <path d="M1115 650h18v22h-18zm0-55h18v22h-18zm64-62h18v22h-18zm0 56h18v22h-18zm80 140h18v22h-18z"/>
      </g>
    </g>

    <!-- floating market terminal -->
    <g transform="translate(95 105)" filter="url(#soft)">
      <rect width="760" height="430" rx="24" fill="#08141f" fill-opacity=".88" stroke="#35658f" stroke-width="2"/>
      <rect x="28" y="30" width="704" height="45" rx="10" fill="#0e2131"/>
      <circle cx="55" cy="52" r="7" fill="#ff6883"/>
      <circle cx="79" cy="52" r="7" fill="#ffd06a"/>
      <circle cx="103" cy="52" r="7" fill="#42d8a3"/>
      <rect x="135" y="45" width="170" height="13" rx="6" fill="#7191ae" opacity=".4"/>
      <rect x="570" y="43" width="135" height="17" rx="8" fill="#1b4e78"/>

      <g stroke="#91b9db" stroke-opacity=".13">
        <path d="M42 128H716M42 192H716M42 256H716M42 320H716M42 384H716"/>
        <path d="M105 98V398M196 98V398M287 98V398M378 98V398M469 98V398M560 98V398M651 98V398"/>
      </g>

      <!-- candles -->
      <g stroke-width="3">
        <path d="M88 280v-85" stroke="#41ddb0"/><rect x="77" y="218" width="22" height="40" rx="3" fill="#41ddb0"/>
        <path d="M138 300v-76" stroke="#ff7086"/><rect x="127" y="240" width="22" height="43" rx="3" fill="#ff7086"/>
        <path d="M188 270v-112" stroke="#41ddb0"/><rect x="177" y="182" width="22" height="57" rx="3" fill="#41ddb0"/>
        <path d="M238 237v-94" stroke="#41ddb0"/><rect x="227" y="163" width="22" height="45" rx="3" fill="#41ddb0"/>
        <path d="M288 250v-78" stroke="#ff7086"/><rect x="277" y="188" width="22" height="39" rx="3" fill="#ff7086"/>
        <path d="M338 210v-105" stroke="#41ddb0"/><rect x="327" y="132" width="22" height="50" rx="3" fill="#41ddb0"/>
        <path d="M388 190V95" stroke="#41ddb0"/><rect x="377" y="114" width="22" height="51" rx="3" fill="#41ddb0"/>
        <path d="M438 224v-91" stroke="#ff7086"/><rect x="427" y="151" width="22" height="48" rx="3" fill="#ff7086"/>
        <path d="M488 185V84" stroke="#41ddb0"/><rect x="477" y="105" width="22" height="53" rx="3" fill="#41ddb0"/>
        <path d="M538 160V69" stroke="#41ddb0"/><rect x="527" y="91" width="22" height="42" rx="3" fill="#41ddb0"/>
        <path d="M588 190V88" stroke="#ff7086"/><rect x="577" y="111" width="22" height="52" rx="3" fill="#ff7086"/>
        <path d="M638 142V54" stroke="#41ddb0"/><rect x="627" y="72" width="22" height="45" rx="3" fill="#41ddb0"/>
      </g>

      <path d="M58 327C145 318 176 281 238 284s92-62 160-51c79 13 95-55 165-45 55 8 88-45 137-80" fill="none" stroke="url(#chart)" stroke-width="8" stroke-linecap="round"/>
      <path d="M58 327C145 318 176 281 238 284s92-62 160-51c79 13 95-55 165-45 55 8 88-45 137-80V398H58Z" fill="url(#chart)" opacity=".08"/>

      <g fill="#95b4cd" opacity=".7">
        <rect x="52" y="361" width="72" height="12" rx="6"/>
        <rect x="139" y="361" width="104" height="12" rx="6"/>
        <rect x="258" y="361" width="58" height="12" rx="6"/>
      </g>
    </g>

    <!-- market tape -->
    <g transform="translate(70 910)" filter="url(#soft)">
      <rect width="1260" height="105" rx="22" fill="#08141f" fill-opacity=".92" stroke="#2b5274"/>
      <g font-family="Arial,sans-serif" font-weight="700">
        <text x="35" y="42" fill="#a5c1d8" font-size="18">SPX</text><text x="35" y="75" fill="#43ddad" font-size="27">+1.18%</text>
        <text x="225" y="42" fill="#a5c1d8" font-size="18">NASDAQ</text><text x="225" y="75" fill="#43ddad" font-size="27">+1.64%</text>
        <text x="475" y="42" fill="#a5c1d8" font-size="18">BIST 100</text><text x="475" y="75" fill="#43ddad" font-size="27">+0.82%</text>
        <text x="705" y="42" fill="#a5c1d8" font-size="18">GOLD</text><text x="705" y="75" fill="#43ddad" font-size="27">+0.41%</text>
        <text x="900" y="42" fill="#a5c1d8" font-size="18">BRENT</text><text x="900" y="75" fill="#ff7e91" font-size="27">−0.53%</text>
        <text x="1090" y="42" fill="#a5c1d8" font-size="18">VIX</text><text x="1090" y="75" fill="#ff7e91" font-size="27">−2.09%</text>
      </g>
    </g>

    <rect width="1400" height="1100" fill="none" stroke="#6b9ac4" stroke-opacity=".25" stroke-width="3"/>
  </g>
</svg>
